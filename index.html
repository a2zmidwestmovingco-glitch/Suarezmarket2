<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suarez Market | Chicago French Market</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body class="bg-stone-50 text-stone-900">
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

const CHEESES = [
  { name: "Provolone", price: 0 }, { name: "Swiss", price: 0 }, { name: "American", price: 0 },
  { name: "Cheddar", price: 0 }, { name: "Mozzarella", price: 0 }, { name: "Brie", price: 1.25 },
  { name: "Goat Cheese", price: 1.25 }, { name: "Fresh Mozzarella", price: 1.25 }, { name: "Pepper Jack", price: 1.25 },
];
const CONDIMENTS = ["Mayo", "Chipotle Mayo", "Ranch", "Honey Mustard", "Dijon Mustard", "Yellow Mustard", "Olive Oil", "Pesto", "Buffalo Sauce", "BBQ Sauce", "Hot Sauce"];
const SAUCE_LEVELS = ["None", "Light", "Regular", "Extra"];
const ADDONS = [
  { name: "Avocado", price: 1.5 }, { name: "Bacon", price: 2.5 }, { name: "Extra Turkey", price: 2 },
  { name: "Extra Salami", price: 2 }, { name: "Prosciutto", price: 3 }, { name: "Chicken Breast", price: 3 },
  { name: "Roasted Red Peppers", price: 0.75 }, { name: "Jalapeños", price: 0.75 }, { name: "Mushrooms", price: 0.75 },
];
const SIDES = [
  { name: "Sea Salt Kettle Chips", price: 2.49 }, { name: "Jalapeño Kettle Chips", price: 2.49 },
  { name: "Mixed Fruit", price: 4.99 }, { name: "Donut", price: 2.49 }, { name: "Cookie", price: 2.99 },
  { name: "Bottled Water", price: 2 }, { name: "Coke", price: 2.5 }, { name: "Sprite", price: 2.5 },
];

const MENU = [
  { category: "Popular Sandwiches", icon: "🥪", items: [
    { name: "Italian Premium", price: 11.99, description: "Prosciutto, hard salami, provolone, Swiss, lettuce, tomato, onion, yellow mustard and olive oil on ciabatta.", included: ["Prosciutto", "Hard Salami", "Provolone", "Swiss", "Lettuce", "Tomato", "Onion", "Yellow Mustard", "Olive Oil"] },
    { name: "Big Blue", price: 11.99, description: "Prosciutto, brie cheese, blueberry jam, and field greens on ciabatta.", included: ["Prosciutto", "Brie", "Blueberry Jam", "Field Greens"] },
    { name: "California", price: 9.99, description: "Roasted turkey, provolone, lettuce, tomato, cucumber, avocado, and ranch dressing on ciabatta.", included: ["Roasted Turkey", "Provolone", "Lettuce", "Tomato", "Cucumber", "Avocado", "Ranch"] },
    { name: "Turkey Pesto", price: 9.99, description: "Black pepper turkey, fresh mozzarella, roasted red peppers, pesto, and field greens on ciabatta.", included: ["Black Pepper Turkey", "Fresh Mozzarella", "Roasted Red Peppers", "Pesto", "Field Greens"] },
    { name: "Curse", price: 9.99, description: "Black pepper salami, goat cheese, roasted red peppers, honey, and field greens on ciabatta.", included: ["Black Pepper Salami", "Goat Cheese", "Roasted Red Peppers", "Honey", "Field Greens"] },
    { name: "Smokey", price: 9.99, description: "Prosciutto, brie cheese spread, onion, honey Dijon, and field greens on ciabatta.", included: ["Prosciutto", "Brie Cheese Spread", "Onion", "Honey Dijon", "Field Greens"] },
  ]},
  { category: "Wraps & Lunch", icon: "🌯", items: [
    { name: "Buffalo Wrap", price: 7.99, description: "Breaded chicken, lettuce, tomato, and Buffalo sauce in a flour tortilla.", included: ["Breaded Chicken", "Lettuce", "Tomato", "Buffalo Sauce"] },
    { name: "Chipotle Wrap", price: 7.99, description: "Breaded chicken breast, cheddar, lettuce, tomato, and chipotle mayo on spinach wrap.", included: ["Breaded Chicken", "Cheddar", "Lettuce", "Tomato", "Chipotle Mayo"] },
    { name: "Buffalo Chicken Sandwich", price: 9.99, description: "Buffalo chicken deli meat, cheddar, lettuce, tomato, onion, and honey Dijon on Italian roll.", included: ["Buffalo Chicken", "Cheddar", "Lettuce", "Tomato", "Onion", "Honey Dijon"] },
    { name: "Veggie Wrap", price: 9.99, description: "Provolone cheese and roasted vegetables in a flour tortilla wrap.", included: ["Provolone", "Roasted Vegetables"] },
    { name: "Tuna Wrap", price: 13.99, description: "Tuna salad, lettuce, tomato, red onion, and cheddar cheese in a flour wrap.", included: ["Tuna Salad", "Lettuce", "Tomato", "Red Onion", "Cheddar"] },
    { name: "Cajun Salmon Wrap", price: 13.99, description: "Cajun salmon, goat cheese, field greens, tomato, and mayo in a flour wrap.", included: ["Cajun Salmon", "Goat Cheese", "Field Greens", "Tomato", "Mayo"] },
  ]},
  { category: "Breakfast & Quick Bites", icon: "☕", items: [
    { name: "Bagel with Cream Cheese", price: 4.49, description: "Fresh bagel with cream cheese. Great for morning pickup.", included: ["Bagel", "Cream Cheese"] },
    { name: "Grilled Cheese", price: 5.99, description: "Classic grilled cheese with your choice of cheese.", included: ["Bread", "Cheese", "Butter"] },
    { name: "Healthy Breakfast Box", price: 9.07, description: "Scrambled eggs, bacon, cheese, and roasted veggies.", included: ["Scrambled Eggs", "Bacon", "Cheese", "Roasted Veggies"] },
    { name: "Donut", price: 2.49, description: "Grab-and-go sweet treat.", included: ["Donut"] },
  ]},
  { category: "Salads & Sides", icon: "🥗", items: [
    { name: "City Fresh Salad", price: 7.99, description: "Apples, cranberries, walnuts, goat cheese, greens, and vinaigrette.", included: ["Apples", "Cranberries", "Walnuts", "Goat Cheese", "Greens", "Vinaigrette"] },
    { name: "Kale Salad", price: 11.99, description: "Kale, red cabbage, cranberries, carrots, pumpkin seeds, lime, olive oil, honey vinaigrette.", included: ["Kale", "Red Cabbage", "Cranberries", "Carrots", "Pumpkin Seeds", "Honey Vinaigrette"] },
    { name: "Mixed Fruit", price: 4.99, description: "Fresh mixed fruit cup.", included: ["Mixed Fruit"] },
  ]},
  { category: "Catering Favorites", icon: "📦", items: [
    { name: "6 Sandwich Box", price: 59.94, description: "Serves 6. Choose up to 6 sandwiches or wraps. Pickup only; 24-hour notice recommended.", included: ["6 Sandwiches or Wraps", "Pickup Only"] },
    { name: "10 Sandwich Box", price: 99.99, description: "Serves 10. Choose up to 10 sandwiches or wraps. Pickup only; 24-hour notice recommended.", included: ["10 Sandwiches or Wraps", "Pickup Only"] },
  ]},
];

const business = {
  name: "Suarez Market",
  location: "Chicago French Market, 131 N Clinton St, Chicago, IL 60661",
  phone: "312-575-0230",
  email: "Zuluj94@suarezmarket.com",
  hours: "Mon–Fri 7AM–7PM • Sat 9AM–4PM",
};

const makeKey = () => Math.random().toString(36).slice(2, 10);
const money = (n) => "$" + n.toFixed(2);
const emptyCustom = () => ({ cheese: "", condiments: {}, addons: [], sides: [], omit: [], notes: "", toasted: false, cutInHalf: false });

function App() {
  const [cart, setCart] = useState([]);
  const [query, setQuery] = useState("");
  const [selectedCategory, setSelectedCategory] = useState("All");
  const [orderType, setOrderType] = useState("Pickup");
  const [showCart, setShowCart] = useState(false);
  const [selectedItem, setSelectedItem] = useState(null);
  const [c, setC] = useState(null);

  const categories = ["All", ...MENU.map((s) => s.category)];
  const flatItems = MENU.flatMap((s) => s.items.map((i) => ({ ...i, category: s.category, icon: s.icon })));
  const filtered = flatItems.filter((i) =>
    (selectedCategory === "All" || i.category === selectedCategory) &&
    (i.name + " " + i.description).toLowerCase().includes(query.toLowerCase()));

  const subtotal = useMemo(() => cart.reduce((s, i) => s + i.totalPrice * i.qty, 0), [cart]);
  const tax = subtotal * 0.1025;
  const total = subtotal + tax;
  const count = cart.reduce((s, i) => s + i.qty, 0);

  const open = (item) => { setSelectedItem(item); setC(emptyCustom()); };
  const close = () => { setSelectedItem(null); setC(null); };
  const toggle = (field, v) => setC((p) => ({ ...p, [field]: p[field].includes(v) ? p[field].filter((x) => x !== v) : [...p[field], v] }));
  const setCondiment = (n, l) => setC((p) => ({ ...p, condiments: { ...p.condiments, [n]: l } }));

  const price = useMemo(() => {
    if (!selectedItem || !c) return 0;
    const ch = CHEESES.find((x) => x.name === c.cheese)?.price || 0;
    const ad = c.addons.reduce((s, n) => s + (ADDONS.find((a) => a.name === n)?.price || 0), 0);
    const sd = c.sides.reduce((s, n) => s + (SIDES.find((a) => a.name === n)?.price || 0), 0);
    return selectedItem.price + ch + ad + sd;
  }, [selectedItem, c]);

  const addItem = () => {
    setCart((p) => [...p, { key: makeKey(), name: selectedItem.name, totalPrice: price, qty: 1, details: c }]);
    close(); setShowCart(true);
  };
  const updateQty = (key, ch) => setCart((p) => p.flatMap((i) => i.key !== key ? [i] : (i.qty + ch <= 0 ? [] : [{ ...i, qty: i.qty + ch }])));
  const removeItem = (key) => setCart((p) => p.filter((i) => i.key !== key));

  const submitOrder = () => {
    if (!cart.length) return;
    const lines = cart.map((i) => {
      const d = i.details;
      const cond = Object.entries(d.condiments).filter(([, l]) => l !== "None").map(([n, l]) => `${n} (${l})`);
      const parts = [d.cheese, ...d.addons, ...d.sides, ...cond].filter(Boolean).join(", ");
      return `${i.qty} x ${i.name} - ${money(i.totalPrice * i.qty)}` +
        (parts ? `\n   Options: ${parts}` : "") +
        (d.omit.length ? `\n   No: ${d.omit.join(", ")}` : "") +
        (d.toasted ? "\n   Toasted" : "") + (d.cutInHalf ? "\n   Cut in half" : "") +
        (d.notes ? `\n   Notes: ${d.notes}` : "");
    }).join("\n\n");
    const body = `${orderType} order\n\n${lines}\n\nSubtotal: ${money(subtotal)}\nEst. tax: ${money(tax)}\nEst. total: ${money(total)}`;
    window.location.href = `mailto:${business.email}?subject=${encodeURIComponent("Suarez Market " + orderType + " Order")}&body=${encodeURIComponent(body)}`;
  };

  const btn = "rounded-2xl px-5 py-2.5 font-bold transition";

  return (
    <div>
      {/* Header */}
      <header className="sticky top-0 z-30 border-b border-stone-200 bg-white/90 backdrop-blur">
        <div className="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-3">
          <div>
            <p className="text-xs font-bold uppercase tracking-wide text-emerald-700">Chicago French Market</p>
            <h1 className="text-2xl font-black">Suarez Market</h1>
          </div>
          <div className="flex flex-wrap gap-2">
            <a href={`tel:${business.phone}`} className={`${btn} bg-stone-100 hover:bg-stone-200`}>📞 Call</a>
            <a href={`mailto:${business.email}?subject=Suarez%20Market%20Order%20Assistance`} className={`${btn} bg-stone-100 hover:bg-stone-200`}>💬 Assistance</a>
            <button onClick={() => setShowCart(!showCart)} className={`${btn} bg-emerald-700 text-white hover:bg-emerald-800`}>🛒 View Cart ({count})</button>
          </div>
        </div>
      </header>

      {/* Hero */}
      <section className="mx-auto grid max-w-6xl gap-8 px-4 py-10 md:grid-cols-2 md:items-center">
        <div>
          <p className="mb-2 inline-block rounded-full bg-emerald-100 px-3 py-1 text-sm font-bold text-emerald-800">Fresh sandwiches • salads • breakfast • catering pickup</p>
          <h2 className="text-4xl font-black leading-tight md:text-5xl">Build your Suarez Market order your way.</h2>
          <p className="mt-4 text-lg text-stone-600">Customize every sandwich or wrap with cheese, condiments, add-ons, sides, removed ingredients, and special instructions before checkout.</p>
          <div className="mt-6 flex flex-wrap gap-3">
            <button onClick={() => document.getElementById("menu")?.scrollIntoView({ behavior: "smooth" })} className={`${btn} bg-emerald-700 text-white hover:bg-emerald-800`}>Start Order</button>
            <a href={`mailto:${business.email}?subject=Suarez%20Market%20Catering%20Request`} className={`${btn} bg-white ring-1 ring-stone-300 hover:bg-stone-100`}>Catering Request</a>
          </div>
        </div>
        <div className="rounded-3xl bg-white p-6 shadow-sm ring-1 ring-stone-200">
          <h3 className="mb-4 text-lg font-black">Order Details</h3>
          <ul className="space-y-3 text-stone-700">
            <li>📍 {business.location}</li>
            <li>🕐 {business.hours}</li>
            <li>📞 {business.phone}</li>
            <li>✉️ {business.email}</li>
          </ul>
          <p className="mt-4 rounded-2xl bg-amber-50 p-3 text-sm text-amber-900"><b>Catering note:</b> Please allow 24 hours for catering orders. Pickup only.</p>
        </div>
      </section>

      {/* Menu */}
      <section id="menu" className="mx-auto max-w-6xl px-4 pb-16">
        <p className="text-sm font-bold uppercase text-emerald-700">Menu Builder</p>
        <h2 className="mb-4 text-3xl font-black">Choose an item to customize</h2>
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="🔍 Search sandwiches, salads..."
          className="w-full rounded-2xl border border-stone-200 bg-white px-4 py-2.5 outline-none ring-emerald-600 focus:ring-2 md:w-96" />
        <div className="my-4 flex flex-wrap gap-2">
          {categories.map((cat) => (
            <button key={cat} onClick={() => setSelectedCategory(cat)}
              className={`rounded-full px-4 py-2 text-sm font-bold transition ${selectedCategory === cat ? "bg-emerald-700 text-white" : "bg-white text-stone-700 ring-1 ring-stone-200 hover:bg-stone-100"}`}>{cat}</button>
          ))}
        </div>
        <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
          {filtered.map((item) => (
            <div key={item.category + item.name} className="flex flex-col rounded-3xl bg-white p-5 shadow-sm ring-1 ring-stone-200">
              <p className="text-xs font-bold uppercase text-stone-500">{item.icon} {item.category}</p>
              <div className="mt-1 flex items-start justify-between gap-2">
                <h3 className="text-xl font-black">{item.name}</h3>
                <span className="text-lg font-black text-emerald-700">{money(item.price)}</span>
              </div>
              <p className="mt-2 flex-1 text-sm text-stone-600">{item.description}</p>
              <div className="mt-3 flex flex-wrap gap-1.5">
                {item.included.slice(0, 5).map((ing) => <span key={ing} className="rounded-full bg-stone-100 px-2.5 py-1 text-xs text-stone-600">{ing}</span>)}
              </div>
              <button onClick={() => open(item)} className={`${btn} mt-4 bg-emerald-700 text-white hover:bg-emerald-800`}>＋ Customize & Add</button>
            </div>
          ))}
          {filtered.length === 0 && <p className="text-stone-500">No items match your search.</p>}
        </div>
      </section>

      {/* Cart drawer */}
      {showCart && (
        <aside className="fixed inset-y-0 right-0 z-40 flex w-full max-w-md flex-col bg-white shadow-2xl">
          <div className="flex items-center justify-between border-b border-stone-200 p-5">
            <h2 className="text-2xl font-black">Your Cart</h2>
            <button onClick={() => setShowCart(false)} className="rounded-full bg-stone-100 px-3 py-1.5 font-bold hover:bg-stone-200">✕</button>
          </div>
          <div className="flex-1 space-y-4 overflow-y-auto p-5">
            <div className="grid grid-cols-2 gap-1 rounded-2xl bg-stone-100 p-1 text-sm font-bold">
              {["Pickup", "Catering"].map((t) => (
                <button key={t} onClick={() => setOrderType(t)} className={`rounded-xl py-2 ${orderType === t ? "bg-white shadow-sm" : "text-stone-500"}`}>{t}</button>
              ))}
            </div>
            {cart.length === 0 ? <p className="py-8 text-center text-stone-500">Add menu items to start your order.</p> :
              cart.map((item) => (
                <div key={item.key} className="rounded-2xl border border-stone-200 p-4">
                  <div className="flex items-start justify-between gap-2">
                    <div>
                      <p className="font-black">{item.name}</p>
                      <p className="text-xs text-stone-500">{[item.details.cheese, ...item.details.addons, ...item.details.sides].filter(Boolean).join(", ") || "Standard"}</p>
                      {item.details.omit.length > 0 && <p className="text-xs text-red-600">No: {item.details.omit.join(", ")}</p>}
                    </div>
                    <button onClick={() => removeItem(item.key)} className="text-stone-400 hover:text-red-600">🗑</button>
                  </div>
                  <div className="mt-3 flex items-center justify-between">
                    <div className="flex items-center gap-3 rounded-full bg-stone-100 px-2 py-1">
                      <button onClick={() => updateQty(item.key, -1)} className="h-7 w-7 rounded-full bg-white font-bold shadow-sm">−</button>
                      <span className="font-bold">{item.qty}</span>
                      <button onClick={() => updateQty(item.key, 1)} className="h-7 w-7 rounded-full bg-white font-bold shadow-sm">＋</button>
                    </div>
                    <p className="font-black">{money(item.totalPrice * item.qty)}</p>
                  </div>
                </div>
              ))}
          </div>
          <div className="space-y-2 border-t border-stone-200 p-5 text-sm">
            <div className="flex justify-between"><span>Subtotal</span><b>{money(subtotal)}</b></div>
            <div className="flex justify-between"><span>Estimated tax</span><b>{money(tax)}</b></div>
            <div className="flex justify-between text-lg"><span>Estimated Total</span><b>{money(total)}</b></div>
            <button onClick={submitOrder} disabled={!cart.length} className={`${btn} w-full bg-emerald-700 text-white hover:bg-emerald-800 disabled:opacity-40`}>✅ Submit Order Request</button>
            <p className="text-xs text-stone-500">Submitting opens an email to Suarez Market with your order. Prices and availability are confirmed by the shop.</p>
          </div>
        </aside>
      )}

      {/* Customizer modal */}
      {selectedItem && c && (
        <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/50 md:items-center md:p-6">
          <div className="flex max-h-[95vh] w-full max-w-3xl flex-col overflow-hidden rounded-t-3xl bg-white md:rounded-3xl">
            <div className="flex items-start justify-between border-b border-stone-200 p-5">
              <div>
                <p className="text-sm font-bold text-emerald-700">Customize Item</p>
                <h2 className="text-2xl font-black">{selectedItem.name}</h2>
                <p className="text-sm text-stone-500">Base price {money(selectedItem.price)}</p>
              </div>
              <button onClick={close} className="rounded-full bg-stone-100 px-3 py-1.5 font-bold hover:bg-stone-200">✕</button>
            </div>
            <div className="flex-1 space-y-7 overflow-y-auto p-5">
              <section>
                <h3 className="mb-3 font-black">1. Choose Cheese</h3>
                <div className="grid grid-cols-2 gap-2 sm:grid-cols-3">
                  {CHEESES.map((ch) => (
                    <button key={ch.name} onClick={() => setC((p) => ({ ...p, cheese: p.cheese === ch.name ? "" : ch.name }))}
                      className={`rounded-2xl border p-3 text-left text-sm font-bold ${c.cheese === ch.name ? "border-emerald-700 bg-emerald-50 text-emerald-900" : "border-stone-200"}`}>
                      {ch.name}<span className="block text-xs font-normal text-stone-500">{ch.price ? `+${money(ch.price)}` : "Included"}</span>
                    </button>
                  ))}
                </div>
              </section>
              <section>
                <h3 className="mb-3 font-black">2. Condiments & Sauce Level</h3>
                <div className="space-y-3">
                  {CONDIMENTS.map((cd) => (
                    <div key={cd}>
                      <p className="mb-1 text-sm font-bold">{cd}</p>
                      <div className="grid grid-cols-4 gap-1.5">
                        {SAUCE_LEVELS.map((lv) => (
                          <button key={lv} onClick={() => setCondiment(cd, lv)}
                            className={`rounded-xl px-2 py-2 text-xs font-bold ${c.condiments[cd] === lv ? "bg-emerald-700 text-white" : "bg-stone-100 text-stone-600"}`}>{lv}</button>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </section>
              <section>
                <h3 className="mb-3 font-black">3. Add Premium Extras</h3>
                <div className="grid grid-cols-2 gap-2 sm:grid-cols-3">
                  {ADDONS.map((a) => (
                    <button key={a.name} onClick={() => toggle("addons", a.name)}
                      className={`rounded-2xl border p-3 text-left text-sm font-bold ${c.addons.includes(a.name) ? "border-emerald-700 bg-emerald-50" : "border-stone-200"}`}>
                      {a.name}<span className="block text-xs font-normal text-stone-500">+{money(a.price)}</span>
                    </button>
                  ))}
                </div>
              </section>
              <section>
                <h3 className="mb-1 font-black">4. Remove Ingredients</h3>
                <p className="mb-3 text-sm text-stone-500">Tap anything you want omitted from this order.</p>
                <div className="flex flex-wrap gap-2">
                  {selectedItem.included.map((ing) => (
                    <button key={ing} onClick={() => toggle("omit", ing)}
                      className={`rounded-full px-3 py-2 text-sm font-bold ${c.omit.includes(ing) ? "bg-red-100 text-red-700 line-through" : "bg-stone-100 text-stone-700"}`}>{ing}</button>
                  ))}
                </div>
              </section>
              <section>
                <h3 className="mb-3 font-black">5. Add Sides & Drinks</h3>
                <div className="grid grid-cols-2 gap-2 sm:grid-cols-3">
                  {SIDES.map((s) => (
                    <button key={s.name} onClick={() => toggle("sides", s.name)}
                      className={`rounded-2xl border p-3 text-left text-sm font-bold ${c.sides.includes(s.name) ? "border-amber-500 bg-amber-50" : "border-stone-200"}`}>
                      {s.name}<span className="block text-xs font-normal text-stone-500">+{money(s.price)}</span>
                    </button>
                  ))}
                </div>
              </section>
              <section>
                <h3 className="mb-3 font-black">6. Special Instructions</h3>
                <div className="mb-3 grid grid-cols-2 gap-2">
                  <button onClick={() => setC((p) => ({ ...p, toasted: !p.toasted }))} className={`rounded-2xl border p-3 text-sm font-bold ${c.toasted ? "border-emerald-700 bg-emerald-50" : "border-stone-200"}`}>Toast it</button>
                  <button onClick={() => setC((p) => ({ ...p, cutInHalf: !p.cutInHalf }))} className={`rounded-2xl border p-3 text-sm font-bold ${c.cutInHalf ? "border-emerald-700 bg-emerald-50" : "border-stone-200"}`}>Cut in half</button>
                </div>
                <textarea value={c.notes} onChange={(e) => setC((p) => ({ ...p, notes: e.target.value }))}
                  className="min-h-24 w-full rounded-2xl border border-stone-200 p-3 outline-none ring-emerald-600 focus:ring-2"
                  placeholder="Example: sauce on side, allergy note, extra toasted..." />
              </section>
            </div>
            <div className="flex items-center justify-between gap-3 border-t border-stone-200 bg-white p-5">
              <div>
                <p className="text-sm text-stone-500">Customized item total</p>
                <p className="text-3xl font-black">{money(price)}</p>
              </div>
              <button onClick={addItem} className="rounded-2xl bg-emerald-700 px-6 py-4 font-black text-white hover:bg-emerald-800">＋ Add Customized Item</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
